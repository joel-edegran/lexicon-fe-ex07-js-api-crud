<!DOCTYPE html>
<html lang="sv">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Roger's Retro Cars</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@picocss/pico@1/css/pico.min.css">
  </head>
  <body>
    <header>
        <h1>My Cars</h1>
        <p>Enkel frontend som pratar med vårt Minimal API</p>
    </header>
    <main>
        <section id="form-section">
            <h3 id="form-title">Lägg till ny bil</h3>
            <form id="form">
                <input type="hidden" id="car-id">
                <div class="grid">
                    <label>
                        Märke
                        <input type="text" id="brand" placeholder="t.ex. Volvo" required>
                    </label>
                    <label>
                        Modell
                        <input type="text" id="model" placeholder="t.ex. 240 Turbo" required>
                    </label>
                </div>
                <div class="grid">
                    <label>
                        Årsmodell
                        <input type="number" id="year" placeholder="t.ex. 1983" required>
                    </label>
                    <label>
                        Färg
                        <input type="text" id="color" placeholder="t.ex. Silver" required>
                    </label>
                </div>
                <div class="form-actions">
                    <button type="submit" id="submit-btn" class="btn-submit">Lägg till bil</button>
                    <button type="button" id="cancel-btn" class="secondary btn-cancel" hidden>Avbryt</button>
                </div>
            </form>
        </section>
        <section>
            <header class="section-header">
                <h3>Våra bilar i databasen</h3>
                <button id="load-btn" class="secondary btn-auto-width">Hämta bilar</button>
            </header>
            <div id="status-message" role="alert" hidden></div>
            <ul id="car-list"></ul>
            <template id="car-item-template">
                <li class="car-list-item card">
                    <div>
                        <strong class="car-title"></strong> (<span class="car-year"></span>) <br>
                        <span class="car-color"></span>
                    </div>
                    <div class="btn-group">
                        <button data-action="edit" class="outline btn-small">Redigera</button>
                        <button data-action="delete" class="outline contrast btn-small">Ta bort</button>
                    </div>
                </li>
            </template>
        </section>
    </main>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
